<!-- @dsCard group="Colors" viewport="700x130" name="Request-type chips" subtitle="Tinted chips for the Type column (rflectr RequestTypeColors)." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:70px;height:64px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle);display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-family:var(--font-mono);font-size:10px;line-height:14px}.sw b{font-weight:500;display:block}.sw span{opacity:.7}.lbl{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.08em}</style></head><body><div class="row" style="gap:6px"><span style="display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;color:var(--type-chat);background:color-mix(in oklch,var(--type-chat) 14%,transparent);border:1px solid color-mix(in oklch,var(--type-chat) 35%,transparent)">Chat</span><span style="display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;color:var(--type-chat-stream);background:color-mix(in oklch,var(--type-chat-stream) 14%,transparent);border:1px solid color-mix(in oklch,var(--type-chat-stream) 35%,transparent)">Chat Stream</span><span style="display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;color:var(--type-responses);background:color-mix(in oklch,var(--type-responses) 14%,transparent);border:1px solid color-mix(in oklch,var(--type-responses) 35%,transparent)">Responses</span><span style="display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;color:var(--type-responses-stream);background:color-mix(in oklch,var(--type-responses-stream) 14%,transparent);border:1px solid color-mix(in oklch,var(--type-responses-stream) 35%,transparent)">Responses Stream</span><span style="display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;color:var(--type-text);background:color-mix(in oklch,var(--type-text) 14%,transparent);border:1px solid color-mix(in oklch,var(--type-text) 35%,transparent)">Text</span><span style="display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;color:var(--type-speech);background:color-mix(in oklch,var(--type-speech) 14%,transparent);border:1px solid color-mix(in oklch,var(--type-speech) 35%,transparent)">Speech</span><span style="display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;color:var(--type-transcription);background:color-mix(in oklch,var(--type-transcription) 14%,transparent);border:1px solid color-mix(in oklch,var(--type-transcription) 35%,transparent)">Transcription</span><span style="display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;color:var(--type-embedding);background:color-mix(in oklch,var(--type-embedding) 14%,transparent);border:1px solid color-mix(in oklch,var(--type-embedding) 35%,transparent)">Embedding</span></div><div class="lbl">color-mix(var(--type-*) 14%) background · 35% border</div></body></html>
