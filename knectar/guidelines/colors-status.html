<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Semantic only — never decorative. Matches rflectr log status: success, error, processing, cancelled." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:70px;height:64px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle);display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-family:var(--font-mono);font-size:10px;line-height:14px}.sw b{font-weight:500;display:block}.sw span{opacity:.7}.lbl{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.08em}</style></head><body><div class="row"><div class="sw" style="background:var(--status-success-bg);color:var(--status-success);border-color:var(--status-success)"><b>● success</b><span>--status-success</span></div><div class="sw" style="background:var(--status-error-bg);color:var(--status-error);border-color:var(--status-error)"><b>● error</b><span>--status-error</span></div><div class="sw" style="background:var(--status-warning-bg);color:var(--status-warning);border-color:var(--status-warning)"><b>● warning</b><span>--status-warning</span></div><div class="sw" style="background:var(--status-info-bg);color:var(--status-info);border-color:var(--status-info)"><b>● info / processing</b><span>--status-info</span></div><div class="sw" style="background:var(--bg-subtle);color:var(--status-cancelled)"><b>● cancelled</b><span>--status-cancelled</span></div></div></body></html>
