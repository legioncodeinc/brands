<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces (light, default)" subtitle="Light-first: mint-grey canvas, white cards, subtle for hover/accent, inset for code." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:70px;height:64px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle);display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-family:var(--font-mono);font-size:10px;line-height:14px}.sw b{font-weight:500;display:block}.sw span{opacity:.7}.lbl{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.08em}</style></head><body><div class="row"><div class="sw" style="background:var(--bg-inset);color:var(--text-primary);"><b>inset</b><span>--bg-inset</span></div><div class="sw" style="background:var(--bg-canvas);color:var(--text-primary);"><b>canvas</b><span>--bg-canvas</span></div><div class="sw" style="background:var(--bg-surface);color:var(--text-primary);"><b>surface / card</b><span>--bg-surface</span></div><div class="sw" style="background:var(--bg-elevated);color:var(--text-primary);"><b>elevated / popover</b><span>--bg-elevated</span></div><div class="sw" style="background:var(--bg-subtle);color:var(--text-primary);"><b>subtle / accent</b><span>--bg-subtle</span></div></div><div class="lbl">shadcn: --background --card --popover --muted --accent --secondary</div></body></html>
