<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces (dark)" subtitle="The .light theme mirrors rflectr’s zinc-light default." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:70px;height:64px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle);display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-family:var(--font-mono);font-size:10px;line-height:14px}.sw b{font-weight:500;display:block}.sw span{opacity:.7}.lbl{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.08em}</style></head><body><div class="dark row" style="padding:0"><div class="sw" style="background:var(--bg-canvas);color:var(--ink-900);"><b>canvas #F4F4F5</b><span>--bg-canvas</span></div><div class="sw" style="background:var(--bg-surface);color:var(--ink-900);"><b>surface #fff</b><span>--bg-surface</span></div><div class="sw" style="background:var(--bg-elevated);color:var(--ink-900);"><b>elevated</b><span>--bg-elevated</span></div><div class="sw" style="background:var(--bg-subtle);color:var(--ink-900);"><b>subtle</b><span>--bg-subtle</span></div><div class="sw" style="background:var(--brand-primary);color:var(--text-primary);"><b>primary</b><span>--brand-primary</span></div></div><div class="lbl">Toggle with .dark on &lt;html&gt; or data-theme="dark"</div></body></html>
