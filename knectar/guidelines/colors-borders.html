<!-- @dsCard group="Colors" viewport="700x130" name="Borders & focus" subtitle="1px borders in three weights; inputs use --input; focus ring is brand green." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:70px;height:64px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle);display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-family:var(--font-mono);font-size:10px;line-height:14px}.sw b{font-weight:500;display:block}.sw span{opacity:.7}.lbl{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.08em}</style></head><body><div class="row"><div class="sw" style="background:var(--bg-surface);border:1px solid var(--border-subtle)"><b>border-subtle</b><span>--border-subtle</span></div><div class="sw" style="background:var(--bg-surface);border:1px solid var(--border-default)"><b>border-default</b><span>--border-default</span></div><div class="sw" style="background:var(--bg-surface);border:1px solid var(--border-strong)"><b>border-strong</b><span>--border-strong</span></div><div class="sw" style="background:var(--bg-surface);border:1px solid var(--input)"><b>input</b><span>--input</span></div><div class="sw" style="background:var(--bg-surface);box-shadow:var(--shadow-ring)"><b>focus</b><span>--shadow-ring</span></div></div></body></html>
