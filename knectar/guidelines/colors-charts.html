<!-- @dsCard group="Colors" viewport="700x120" name="Chart palette" subtitle="Five series colours, green first. Thin strokes, no area fills." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:70px;height:64px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle);display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-family:var(--font-mono);font-size:10px;line-height:14px}.sw b{font-weight:500;display:block}.sw span{opacity:.7}.lbl{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.08em}</style></head><body><div class="row"><div class="sw" style="background:var(--chart-1);color:var(--ink-900)"><b>series 1</b><span>--chart-1</span></div><div class="sw" style="background:var(--chart-2);color:var(--ink-900)"><b>series 2</b><span>--chart-2</span></div><div class="sw" style="background:var(--chart-3);color:var(--ink-900)"><b>series 3</b><span>--chart-3</span></div><div class="sw" style="background:var(--chart-4);color:var(--ink-900)"><b>series 4</b><span>--chart-4</span></div><div class="sw" style="background:var(--chart-5);color:var(--ink-900)"><b>series 5</b><span>--chart-5</span></div></div></body></html>
