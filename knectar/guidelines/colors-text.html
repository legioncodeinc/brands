<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:70px;height:64px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle);display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-family:var(--font-mono);font-size:10px;line-height:14px}.sw b{font-weight:500;display:block}.sw span{opacity:.7}.lbl{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.08em}</style></head><body><div class="row" style="align-items:stretch"><div class="sw" style="background:var(--bg-surface);color:var(--text-primary)"><b style="font-family:var(--font-sans);font-size:15px">Aa Request log</b><span>--text-primary</span></div><div class="sw" style="background:var(--bg-surface);color:var(--text-secondary)"><b style="font-family:var(--font-sans);font-size:15px">Aa Request log</b><span>--text-secondary</span></div><div class="sw" style="background:var(--bg-surface);color:var(--text-tertiary)"><b style="font-family:var(--font-sans);font-size:15px">Aa Request log</b><span>--text-tertiary</span></div><div class="sw" style="background:var(--bg-surface);color:var(--text-disabled)"><b style="font-family:var(--font-sans);font-size:15px">Aa Request log</b><span>--text-disabled</span></div><div class="sw" style="background:var(--text-inverse);color:var(--text-primary);background:var(--text-primary);color:var(--text-inverse)"><b>inverse</b><span>--text-inverse</span></div></div></body></html>
