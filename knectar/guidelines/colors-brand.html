<!-- @dsCard group="Colors" viewport="700x150" name="Brand green" subtitle="Nectar green → wing teal. The gradient is the signature; solid green for text/status." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:70px;height:64px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle);display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-family:var(--font-mono);font-size:10px;line-height:14px}.sw b{font-weight:500;display:block}.sw span{opacity:.7}.lbl{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.08em}</style></head><body><div class="row"><div class="sw" style="background:var(--brand-primary);color:var(--ink-900);"><b>primary</b><span>--brand-primary</span></div><div class="sw" style="background:var(--brand-primary-hover);color:var(--ink-900);"><b>hover</b><span>--brand-primary-hover</span></div><div class="sw" style="background:var(--brand-primary-pressed);color:var(--ink-900);"><b>pressed</b><span>--brand-primary-pressed</span></div><div class="sw" style="background:var(--brand-primary-subtle);color:var(--text-primary);"><b>subtle 12%</b><span>--brand-primary-subtle</span></div><div class="sw" style="background:var(--brand-primary-on);color:var(--text-primary);"><b>on-primary</b><span>--brand-primary-on</span></div></div><div class="row" style="margin-top:4px"><div class="sw" style="flex:2;background:var(--grad-nectar);color:var(--ink-900)"><b>--grad-nectar</b><span>#3DDC97 → #2DD4BF</span></div><div class="sw" style="background:var(--grad-nectar-soft);color:var(--brand-primary)"><b>--grad-nectar-soft</b></div><div class="sw" style="background:var(--bg-surface);box-shadow:var(--glow-nectar)"><b>--glow-nectar</b></div><span class="nectar-text" style="font-size:22px;font-weight:700;align-self:center;padding:0 8px">flowing</span></div></body></html>
