<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:12px;overflow:hidden}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:44px;border-radius:var(--r-sm);border:1px solid var(--border-hairline)}.sw b{font:var(--type-code);color:var(--text-secondary);font-weight:400}.sw small{font:var(--type-code);color:var(--text-tertiary)}.lbl{font:var(--type-eyebrow);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div data-theme="light" style="background:var(--surface-app);color:var(--text-primary);border-radius:var(--r-md);padding:14px;display:flex;gap:14px;align-items:center;border:1px solid var(--border-subtle)"><img src="../assets/lockup/rflectr-lockup-horizontal-on-light.svg" style="height:28px" alt="rflectr"><span style="flex:1;font:var(--type-body);color:var(--text-secondary)">Body text on paper surfaces. <a href="#light-theme">Light theme link</a></span><span style="font:var(--type-caption);padding:3px 8px;border-radius:var(--r-pill);background:var(--fill-route-soft);color:var(--text-route);border:1px solid var(--border-route)">Routing</span><span style="font:var(--type-caption);padding:3px 8px;border-radius:var(--r-pill);background:var(--fill-observe-soft);color:var(--text-observe)">Observing</span><span style="font:var(--type-caption);padding:3px 8px;border-radius:var(--r-pill);background:var(--fill-danger-soft);color:var(--text-danger)">Failed</span></div></body></html>
