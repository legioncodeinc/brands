<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:12px;overflow:hidden}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:44px;border-radius:var(--r-sm);border:1px solid var(--border-hairline)}.sw b{font:var(--type-code);color:var(--text-secondary);font-weight:400}.sw small{font:var(--type-code);color:var(--text-tertiary)}.lbl{font:var(--type-eyebrow);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-tertiary)}.rl{stroke:var(--route-9);stroke-width:2;fill:none;stroke-dasharray:6 6;animation:rflectr-route-flow var(--route-flow-speed) linear infinite}.ol{stroke:var(--observe-9);stroke-width:2;fill:none;stroke-dasharray:2 6;animation:rflectr-route-flow 2.4s linear infinite}.xl{stroke:var(--n-6);stroke-width:2;fill:none}</style></head><body><svg role="img" aria-label="Route flow example" width="668" height="84" viewBox="0 0 668 84"><path class="rl" d="M0 16 H240 C300 16 300 42 360 42 H668"/><path class="ol" d="M0 42 H668"/><path class="xl" d="M0 68 H668"/><g font-family="Geist Mono" font-size="11" fill="#8E98A6"><text x="0" y="10">route</text><text x="0" y="36">observe</text><text x="0" y="62">off</text></g></svg><div class="lbl">@keyframes rflectr-route-flow · --route-flow-speed 1.6s · linear · pauses when draining</div></body></html>
