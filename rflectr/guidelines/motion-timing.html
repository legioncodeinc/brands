<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:12px;overflow:hidden}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:44px;border-radius:var(--r-sm);border:1px solid var(--border-hairline)}.sw b{font:var(--type-code);color:var(--text-secondary);font-weight:400}.sw small{font:var(--type-code);color:var(--text-tertiary)}.lbl{font:var(--type-eyebrow);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-tertiary)}.demo{display:flex;gap:10px}.b{width:120px;height:44px;border-radius:var(--r-md);background:var(--surface-card);border:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:center;font:var(--type-code);color:var(--text-secondary);transition:transform var(--dur-base) var(--ease-out),background var(--dur-fast) var(--ease-out),border-color var(--dur-fast)}.b:hover{background:var(--surface-hover);border-color:var(--border-strong);transform:translateY(-2px)}.b:active{transform:scale(.98)}.k{animation:rflectr-rise var(--dur-enter) var(--ease-out) both}.pulse{width:8px;height:8px;border-radius:50%;background:var(--route-9);animation:rflectr-ring 1.4s var(--ease-out) infinite}.sk{height:12px;border-radius:3px;background:linear-gradient(90deg,var(--n-3) 25%,var(--n-4) 50%,var(--n-3) 75%);background-size:200% 100%;animation:rflectr-shimmer 1.6s linear infinite}</style></head><body><div class="demo"><div class="b k">hover · rise 2px</div><div class="b k" style="animation-delay:60ms">press · scale .98</div><div class="b k" style="animation-delay:120ms">enter · rise 6px</div><div class="b k" style="animation-delay:180ms;gap:8px"><i class="pulse"></i>active ring</div><div class="b k" style="animation-delay:240ms;flex-direction:column;gap:6px;align-items:stretch;padding:0 14px"><i class="sk"></i><i class="sk" style="width:60%"></i></div></div><div class="lbl">--dur-fast 120 · --dur-base 180 · --dur-slow 280 · --dur-enter 360 · --ease-out cubic-bezier(.2,.8,.2,1)</div></body></html>
