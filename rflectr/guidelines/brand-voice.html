<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:12px;overflow:hidden}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:44px;border-radius:var(--r-sm);border:1px solid var(--border-hairline)}.sw b{font:var(--type-code);color:var(--text-secondary);font-weight:400}.sw small{font:var(--type-code);color:var(--text-tertiary)}.lbl{font:var(--type-eyebrow);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;font:var(--type-caption)"><div style="border:1px solid var(--border-route);border-radius:var(--r-md);padding:10px 12px;background:var(--fill-route-soft)"><div class="lbl" style="color:var(--text-route);margin-bottom:6px">Say</div><div style="color:var(--text-primary)">“Claude Code 2.1.259 · Routing via Anthropic · Verified 3 days ago”</div><div style="color:var(--text-secondary);margin-top:4px">“Turning routing off affects new traffic. Existing streams finish on their current route.”</div></div><div style="border:1px solid var(--border-subtle);border-radius:var(--r-md);padding:10px 12px"><div class="lbl" style="color:var(--text-danger);margin-bottom:6px">Avoid</div><div style="color:var(--text-primary);text-decoration:line-through;text-decoration-color:var(--danger-7)">“Works seamlessly with every version!”</div><div style="color:var(--text-secondary);margin-top:4px;text-decoration:line-through;text-decoration-color:var(--danger-7)">“You saved $12 this week 🎉”</div></div></div></body></html>
