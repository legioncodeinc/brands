<!-- @dsCard group="Colors" viewport="700x170" name="Semantic states" subtitle="Warning and danger — used for Draining, Failed, Stale; never green" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:12px;overflow:hidden}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:44px;border-radius:var(--r-sm);border:1px solid var(--border-hairline)}.sw b{font:var(--type-code);color:var(--text-secondary);font-weight:400}.sw small{font:var(--type-code);color:var(--text-tertiary)}.lbl{font:var(--type-eyebrow);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--warn-3)"></i><b>--warn-3</b><small>var(--warn-3)</small></div><div class="sw"><i style="background:var(--warn-7)"></i><b>--warn-7</b><small>var(--warn-7)</small></div><div class="sw"><i style="background:var(--warn-9)"></i><b>--warn-9</b><small>var(--warn-9)</small></div><div class="sw"><i style="background:var(--danger-3)"></i><b>--danger-3</b><small>var(--danger-3)</small></div><div class="sw"><i style="background:var(--danger-7)"></i><b>--danger-7</b><small>var(--danger-7)</small></div><div class="sw"><i style="background:var(--danger-9)"></i><b>--danger-9</b><small>var(--danger-9)</small></div></div>
<div class="row" style="gap:16px;align-items:center"><span style="display:flex;gap:6px;align-items:center;font:var(--type-caption);color:var(--text-secondary)"><i style="width:8px;height:8px;border-radius:50%;background:var(--state-off)"></i>Off</span><span style="display:flex;gap:6px;align-items:center;font:var(--type-caption);color:var(--text-secondary)"><i style="width:8px;height:8px;border-radius:50%;background:var(--state-observe)"></i>Observe</span><span style="display:flex;gap:6px;align-items:center;font:var(--type-caption);color:var(--text-secondary)"><i style="width:8px;height:8px;border-radius:50%;background:var(--state-route)"></i>Route</span><span style="display:flex;gap:6px;align-items:center;font:var(--type-caption);color:var(--text-secondary)"><i style="width:8px;height:8px;border-radius:50%;background:var(--state-draining)"></i>Draining</span><span style="display:flex;gap:6px;align-items:center;font:var(--type-caption);color:var(--text-secondary)"><i style="width:8px;height:8px;border-radius:50%;background:var(--state-failed)"></i>Failed</span><span style="display:flex;gap:6px;align-items:center;font:var(--type-caption);color:var(--text-secondary)"><i style="width:8px;height:8px;border-radius:50%;background:var(--state-starting)"></i>Starting</span></div></body></html>
