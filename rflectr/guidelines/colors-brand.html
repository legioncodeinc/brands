<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:12px;overflow:hidden}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:44px;border-radius:var(--r-sm);border:1px solid var(--border-hairline)}.sw b{font:var(--type-code);color:var(--text-secondary);font-weight:400}.sw small{font:var(--type-code);color:var(--text-tertiary)}.lbl{font:var(--type-eyebrow);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--brand-ink)"></i><b>--brand-ink</b><small>var(--brand-ink)</small></div><div class="sw"><i style="background:var(--brand-paper)"></i><b>--brand-paper</b><small>var(--brand-paper)</small></div><div class="sw"><i style="background:var(--brand-route)"></i><b>--brand-route</b><small>var(--brand-route)</small></div><div class="sw"><i style="background:var(--brand-route-deep)"></i><b>--brand-route-deep</b><small>var(--brand-route-deep)</small></div></div><div class="lbl">Green = committed route only. Never a health color.</div></body></html>
