<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:12px;overflow:hidden}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:44px;border-radius:var(--r-sm);border:1px solid var(--border-hairline)}.sw b{font:var(--type-code);color:var(--text-secondary);font-weight:400}.sw small{font:var(--type-code);color:var(--text-tertiary)}.lbl{font:var(--type-eyebrow);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div style="display:flex;gap:0;height:110px;border:1px solid var(--border-subtle);border-radius:var(--r-md);overflow:hidden"><div style="width:120px;background:var(--surface-sidebar);border-right:1px solid var(--border-hairline);padding:10px"><small style="font:var(--type-code);color:var(--text-tertiary)">--surface-sidebar</small></div><div style="flex:1;background:var(--surface-app);padding:10px;display:flex;gap:10px"><div style="flex:1;background:var(--surface-panel);border:1px solid var(--border-hairline);border-radius:var(--r-md);padding:10px"><small style="font:var(--type-code);color:var(--text-tertiary)">--surface-panel</small><div style="margin-top:8px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--r-sm);padding:8px"><small style="font:var(--type-code);color:var(--text-tertiary)">--surface-card</small><div style="margin-top:6px;background:var(--surface-raised);border-radius:var(--r-xs);height:14px"></div></div></div></div></div></body></html>
