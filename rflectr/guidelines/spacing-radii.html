ht:44px;border-radius:var(--r-md);background:var(--surface-card);border:1px solid var(--route-9);box-shadow:var(--shadow-route-glow)"></i><small>--shadow-route-glow</small></div></div><div class="row" style="gap:16px"><span style="flex:1;height:0;border-top:1px solid var(--border-hairline);position:relative"><small style="position:absolute;top:4px;font:var(--type-code);color:var(--text-tertiary)">--border-hairline</small></span><span style="flex:1;height:0;border-top:1px solid var(--border-subtle);position:relative"><small style="position:absolute;top:4px;font:var(--type-code);color:var(--text-tertiary)">--border-subtle</small></span><span style="flex:1;height:0;border-top:1px solid var(--border-strong);position:relative"><small style="position:absolute;top:4px;font:var(--type-code);color:var(--text-tertiary)">--border-strong</small></span></div></body></html>
