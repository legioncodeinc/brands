<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:12px;overflow:hidden}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:44px;border-radius:var(--r-sm);border:1px solid var(--border-hairline)}.sw b{font:var(--type-code);color:var(--text-secondary);font-weight:400}.sw small{font:var(--type-code);color:var(--text-tertiary)}.lbl{font:var(--type-eyebrow);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div class="row" style="gap:3px"><div class="sw" style="gap:4px"><i style="background:var(--n-0);height:56px;border-radius:3px"></i><small>0</small></div><div class="sw" style="gap:4px"><i style="background:var(--n-1);height:56px;border-radius:3px"></i><small>1</small></div><div class="sw" style="gap:4px"><i style="background:var(--n-2);height:56px;border-radius:3px"></i><small>2</small></div><div class="sw" style="gap:4px"><i style="background:var(--n-3);height:56px;border-radius:3px"></i><small>3</small></div><div class="sw" style="gap:4px"><i style="background:var(--n-4);height:56px;border-radius:3px"></i><small>4</small></div><div class="sw" style="gap:4px"><i style="background:var(--n-5);height:56px;border-radius:3px"></i><small>5</small></div><div class="sw" style="gap:4px"><i style="background:var(--n-6);height:56px;border-radius:3px"></i><small>6</small></div><div class="sw" style="gap:4px"><i style="background:var(--n-7);height:56px;border-radius:3px"></i><small>7</small></div><div class="sw" style="gap:4px"><i style="background:var(--n-8);height:56px;border-radius:3px"></i><small>8</small></div><div class="sw" style="gap:4px"><i style="background:var(--n-9);height:56px;border-radius:3px"></i><small>9</small></div><div class="sw" style="gap:4px"><i style="background:var(--n-10);height:56px;border-radius:3px"></i><small>10</small></div><div class="sw" style="gap:4px"><i style="background:var(--n-11);height:56px;border-radius:3px"></i><small>11</small></div><div class="sw" style="gap:4px"><i style="background:var(--n-12);height:56px;border-radius:3px"></i><small>12</small></div></div><div class="lbl">Surfaces use 0–4 · borders as alpha white · text 8–12</div></body></html>
