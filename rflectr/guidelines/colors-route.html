<!-- @dsCard group="Colors" viewport="700x170" name="Route + Observe scales" subtitle="Green for Route state and route lines; slate-blue for Observe" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:12px;overflow:hidden}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:44px;border-radius:var(--r-sm);border:1px solid var(--border-hairline)}.sw b{font:var(--type-code);color:var(--text-secondary);font-weight:400}.sw small{font:var(--type-code);color:var(--text-tertiary)}.lbl{font:var(--type-eyebrow);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--route-3)"></i><b>--route-3</b><small>var(--route-3)</small></div><div class="sw"><i style="background:var(--route-5)"></i><b>--route-5</b><small>var(--route-5)</small></div><div class="sw"><i style="background:var(--route-7)"></i><b>--route-7</b><small>var(--route-7)</small></div><div class="sw"><i style="background:var(--route-9)"></i><b>--route-9</b><small>var(--route-9)</small></div><div class="sw"><i style="background:var(--route-11)"></i><b>--route-11</b><small>var(--route-11)</small></div></div><div class="row"><div class="sw"><i style="background:var(--observe-3)"></i><b>--observe-3</b><small>var(--observe-3)</small></div><div class="sw"><i style="background:var(--observe-7)"></i><b>--observe-7</b><small>var(--observe-7)</small></div><div class="sw"><i style="background:var(--observe-9)"></i><b>--observe-9</b><small>var(--observe-9)</small></div><div class="sw"></div><div class="sw"></div></div></body></html>
